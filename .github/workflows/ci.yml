name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (132 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run test suite
        run: python -m unittest discover -s tests
      - name: Check dependency consistency
        run: python -m pip check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=low

  landing:
    name: Landing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=low

  schema:
    name: PostgreSQL 16 and Alembic
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: integrix
          POSTGRES_USER: integrix
          POSTGRES_PASSWORD: integrix-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integrix -d integrix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://integrix:integrix-ci@localhost:5432/integrix
      DB_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Upgrade to 0006 and insert a JSON payload
        run: |
          alembic upgrade 0006_reset_vapi_cursor
          python - <<'PY'
          import psycopg
          from psycopg.types.json import Json

          payload = {"nested": {"value": 42}, "items": [1, 2, 3], "masked": "***"}
          with psycopg.connect("postgresql://integrix:integrix-ci@localhost:5432/integrix") as conn:
              conn.execute(
                  """
                  INSERT INTO call_events (
                      id, tenant_id, call_id, tool_name, event_type, payload_masked
                  ) VALUES (%s, %s, %s, %s, %s, %s)
                  """,
                  ("ci-json-payload", "tenant_ci", "call_ci", "tool_ci", "request", Json(payload)),
              )
          PY
      - name: Upgrade to JSONB and verify data
        run: |
          alembic upgrade head
          python - <<'PY'
          import psycopg

          expected = {"nested": {"value": 42}, "items": [1, 2, 3], "masked": "***"}
          with psycopg.connect("postgresql://integrix:integrix-ci@localhost:5432/integrix") as conn:
              data_type = conn.execute(
                  """
                  SELECT data_type
                  FROM information_schema.columns
                  WHERE table_schema = 'public'
                    AND table_name = 'call_events'
                    AND column_name = 'payload_masked'
                  """
              ).fetchone()[0]
              count = conn.execute("SELECT count(*) FROM call_events").fetchone()[0]
              payload = conn.execute(
                  "SELECT payload_masked FROM call_events WHERE id = %s",
                  ("ci-json-payload",),
              ).fetchone()[0]
          assert data_type == "jsonb", data_type
          assert count == 1, count
          assert payload == expected, payload
          PY
          alembic current
          alembic heads
          alembic check
      - name: Downgrade and upgrade the disposable database
        run: |
          alembic downgrade 0006_reset_vapi_cursor
          python - <<'PY'
          import psycopg

          expected = {"nested": {"value": 42}, "items": [1, 2, 3], "masked": "***"}
          with psycopg.connect("postgresql://integrix:integrix-ci@localhost:5432/integrix") as conn:
              data_type = conn.execute(
                  """
                  SELECT data_type
                  FROM information_schema.columns
                  WHERE table_schema = 'public'
                    AND table_name = 'call_events'
                    AND column_name = 'payload_masked'
                  """
              ).fetchone()[0]
              count = conn.execute("SELECT count(*) FROM call_events").fetchone()[0]
              payload = conn.execute(
                  "SELECT payload_masked FROM call_events WHERE id = %s",
                  ("ci-json-payload",),
              ).fetchone()[0]
          assert data_type == "json", data_type
          assert count == 1, count
          assert payload == expected, payload
          PY
          alembic upgrade head
          alembic check
      - name: Upgrade an empty database directly to head
        run: |
          python - <<'PY'
          import psycopg

          with psycopg.connect(
              "postgresql://integrix:integrix-ci@localhost:5432/postgres",
              autocommit=True,
          ) as conn:
              conn.execute("CREATE DATABASE integrix_fresh")
          PY
          DATABASE_URL=postgresql+psycopg://integrix:integrix-ci@localhost:5432/integrix_fresh alembic upgrade head
          DATABASE_URL=postgresql+psycopg://integrix:integrix-ci@localhost:5432/integrix_fresh alembic current
          DATABASE_URL=postgresql+psycopg://integrix:integrix-ci@localhost:5432/integrix_fresh alembic check

  docker:
    name: Docker and deploy configuration
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - landing
      - schema
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        env:
          APP_ENV_FILE: .env.production.example
          CADDY_EMAIL: ci@example.test
          DOMAIN: api.example.test
          POSTGRES_PASSWORD: integrix-ci
        run: docker compose -f docker-compose.production.yml config --quiet
      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          -e CADDY_EMAIL=ci@example.test
          -e DOMAIN=api.example.test
          -e LANDING_DOMAIN=example.test
          -e WWW_LANDING_DOMAIN=www.example.test
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine
          caddy validate --config /etc/caddy/Caddyfile
      - name: Build production image
        run: docker build --tag "integrix-ci:${GITHUB_SHA}" .
