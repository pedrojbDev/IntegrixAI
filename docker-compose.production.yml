services:
  app:
    build:
      context: .
    image: ${APP_IMAGE:-integrixai-app}
    container_name: integrix-api
    restart: unless-stopped
    init: true
    pids_limit: ${APP_PIDS_LIMIT:-256}
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - ./data/especialidade.csv:/app/data/especialidade.csv:ro
    command: /app/deploy/start-api.sh

  postgres:
    image: postgres:16-alpine
    container_name: integrix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-integrix}
      POSTGRES_USER: ${POSTGRES_USER:-integrix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-integrix} -d ${POSTGRES_DB:-integrix}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"

  caddy:
    image: caddy:2-alpine
    container_name: integrix-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      LANDING_DOMAIN: ${LANDING_DOMAIN:-integrix.com.br}
      WWW_LANDING_DOMAIN: ${WWW_LANDING_DOMAIN:-www.integrix.com.br}
      CADDY_EMAIL: ${CADDY_EMAIL:?CADDY_EMAIL is required}
    volumes:
      - ${CADDY_CONFIG_PATH:-./deploy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - ./landing/dist:/srv/integrix/landing:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
